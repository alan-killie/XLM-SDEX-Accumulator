- name: Consolidate Unmapped Positions
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          python -c '
          import json

          def consolidate_unmapped_positions(state):
              unmapped = [p for p in state["open_positions"] if not p.get("sell_offer_id")]
              if len(unmapped) <= 1:
                  print("No unmapped backlog to consolidate.")
                  return

              # Group unmapped positions by target_sell_price
              grouped = {}
              for pos in unmapped:
                  price_key = round(pos["target_sell_price"], 6)
                  grouped.setdefault(price_key, []).append(pos)

              new_open_positions = [p for p in state["open_positions"] if p.get("sell_offer_id")]

              for price, group in grouped.items():
                  base_pos = group[0]
                  for addon in group[1:]:
                      base_pos["cost_usdc"] = round(base_pos.get("cost_usdc", 0.0) + addon.get("cost_usdc", 0.0), 6)
                      base_pos["xlm_to_sell"] = round(base_pos.get("xlm_to_sell", 0.0) + addon.get("xlm_to_sell", 0.0), 7)
                      base_pos["pending_xlm_gain"] = round(base_pos.get("pending_xlm_gain", 0.0) + addon.get("pending_xlm_gain", 0.0), 7)
                  new_open_positions.append(base_pos)

              state["open_positions"] = new_open_positions
              print(f"Consolidated unmapped positions down to {len(grouped)} entry/entries.")

          # Load state
          with open("grid_state.json", "r") as f:
              state = json.load(f)

          # Run consolidation
          consolidate_unmapped_positions(state)

          # Save state back
          with open("grid_state.json", "w") as f:
              json.dump(state, f, indent=2)
          '
