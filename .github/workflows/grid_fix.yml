name: Run State Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run state fix script
        run: python grid_bot.py

      - name: Commit updated grid state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grid_state.json
          git diff --staged --quiet || (git commit -m "fix: consolidate grid state backlog" && git push)
