name: XLM SDEX Accumulator

on:
#  schedule:
#    - cron: '8,30,50 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-bot]

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants permission to push grid_state.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install stellar-sdk

      - name: Run Accumulator Bot
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: python sdex_xlm_accumulator.py

      - name: Commit and push updated JSON state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add grid_state.json
          
          # Only commit if grid_state.json actually changed
          if ! git diff --cached --quiet; then
            git commit -m "chore: update grid_state.json [skip ci]"
            git push
          else
            echo "No changes to grid_state.json"
          fi
